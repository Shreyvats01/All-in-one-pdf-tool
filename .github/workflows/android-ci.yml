name: Android CI & Offline Privacy Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: Offline Audit, Robolectric Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore Exists
        run: |
          if [[ ! -f "debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Step 1 — Verify Source Manifest 100% Offline Guarantee
        run: |
          chmod +x scripts/verify_offline_release.sh
          bash scripts/verify_offline_release.sh

      - name: Step 2 — Run Unit & Robolectric Test Suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Step 3 — Run Android Lint Static Analysis
        run: gradle :app:lintDebug --stacktrace

      - name: Step 4 — Assemble Debug APK & Audit Merged Binary Permissions
        run: |
          gradle :app:assembleDebug --stacktrace
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          bash scripts/verify_offline_release.sh "$DEBUG_APK"

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
